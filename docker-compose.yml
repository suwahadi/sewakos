services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kos
      POSTGRES_PASSWORD: kos
      POSTGRES_DB: kos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kos -d kos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: bitnamilegacy/minio:latest
    entrypoint: ["minio"]
    command: server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kosminio
      MINIO_ROOT_PASSWORD: kosminio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: bitnamilegacy/minio-client:latest
    environment:
      HOME: /tmp
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 kosminio kosminio123 &&
      (mc mb -p local/kos-bucket || true) &&
      mc anonymous set download local/kos-bucket &&
      mc ilm rule add --expire-days 1 --prefix uploads/ local/kos-bucket
      "
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:
